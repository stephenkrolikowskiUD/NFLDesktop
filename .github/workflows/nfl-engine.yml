name: NFL Engine

on:
  workflow_dispatch:
  schedule:
    # Temporary low-quota cadence: spend the shared Odds API budget once, after
    # Sunday inactive reports and before the main 1 PM slate.
    - cron: "0 16 * * 0"

jobs:
  run-nfl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # nflverse needs no key — its release assets are public.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FP_PRO_API_KEY: ${{ secrets.FP_PRO_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # Preserve a final emergency reserve while allowing one Sunday pull from
      # the current 479-credit balance. Limit props to the active Sun/Mon slate.
      NFL_ODDS_CREDIT_FLOOR: "250"
      NFL_PROPS_WINDOW_DAYS: "2"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NFL engine
        run: python NFLEnginev1.py
