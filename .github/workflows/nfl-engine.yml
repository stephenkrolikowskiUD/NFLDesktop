name: NFL Engine

on:
  workflow_dispatch:
    inputs:
      reuse_sheet_props:
        description: "Reuse the latest Player_Props sheet without spending Odds API credits"
        required: false
        type: boolean
        default: false
  schedule:
    # Sunday research refresh: 9 AM EDT / 8 AM EST, before early kickoffs.
    - cron: "0 13 * * 0"
    # Monday/Thursday game-day refresh and Saturday research: 1 PM EDT / noon EST.
    - cron: "0 17 * * 1,4,6"

jobs:
  run-nfl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # nflverse needs no key — its release assets are public.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FP_PRO_API_KEY: ${{ secrets.FP_PRO_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # Preserve a reserve and avoid paying for distant slates on every refresh.
      NFL_ODDS_CREDIT_FLOOR: "500"
      NFL_PROPS_WINDOW_DAYS: "2"
      NFL_REUSE_SHEET_PROPS: ${{ inputs.reuse_sheet_props && 'true' || 'false' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NFL engine
        run: python NFLEnginev1.py
