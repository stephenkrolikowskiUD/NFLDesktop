name: NFL Engine

on:
  workflow_dispatch:
  schedule:
    # Week-shaped NFL cadence, in UTC:
    # Wed/Thu/Fri 7:00 PM ET — practice / injury refresh
    - cron: "0 23 * * 3"
    - cron: "0 23 * * 4"
    - cron: "0 23 * * 5"
    # Sat 7:00 PM ET — pre-Sunday slate refresh
    - cron: "0 23 * * 6"
    # Sun 10:00 AM ET — Sunday game-day refresh
    - cron: "0 14 * * 0"
    # Sun 7:00 PM ET — pre-Monday refresh
    - cron: "0 23 * * 0"
    # Mon 7:00 PM ET — Monday game-day refresh
    - cron: "0 23 * * 1"

jobs:
  run-nfl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # nflverse needs no key — its release assets are public.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NFL_MODEL_VERSION: nfl-2026-regular-season-v1
      NFL_MODEL_ERA: nfl-2026-regular-season-v1
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NFL engine
        run: python NFLEnginev1.py
